name: Morning report
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi fonts-dejavu-core
      - run: python -m pip install 'Pillow>=12,<14'
      - run: make test arm
      - run: python ui/preview_test.py --output build/preview
      - uses: actions/upload-artifact@v4
        with:
          name: morning-report-cortex-m4
          path: |
            build/libmorning.a
            build/preview/
